name: Publish changed taxi data

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

concurrency:
  group: publish-changed-taxi-data
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Plan the automatic semantic release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tags="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          previous_data_tag="$(
            printf '%s\n' "$release_tags" \
              | grep -E '^(data-multi-|v[0-9]+\.[0-9]+\.[0-9]+$)' \
              | head -n 1
          )"
          previous_version_tag="$(
            printf '%s\n' "$release_tags" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          args=(--github-output "$GITHUB_OUTPUT")
          if [ -n "$previous_version_tag" ]; then
            args+=(--previous-version-tag "$previous_version_tag")
          fi
          if [ -n "$previous_data_tag" ]; then
            args+=(--previous-data-tag "$previous_data_tag")
          fi
          python tools/release_version.py "${args[@]}"

      - name: Tag the planned semantic version
        if: steps.release.outputs.changed == 'true'
        id: tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          builds="$(grep -h '^[[:space:]]*build = "' Data/*/TaxiNodes.lua | sed -n 's/.*"\([0-9.]*\)".*/\1/p')"
          if [ -z "$builds" ] || printf '%s\n' "$builds" | grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid generated build catalog" >&2
            exit 1
          fi

          tag="$RELEASE_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid planned release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $tag already exists on another commit" >&2
              exit 1
            fi
            echo "Using existing unpublished tag: $tag"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "LibTaxiData $tag: $(printf '%s' "$builds" | paste -sd, -)"
          git push origin "$tag"

      - name: Start deployment
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --ref main -f ref="$RELEASE_TAG"
