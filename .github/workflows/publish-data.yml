name: Publish merged taxi data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Data/**
      - Locale/**
      - LibTaxiData.toc
      - tools/profiles.json

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the data build
        id: tag
        run: |
          builds="$(grep -h '^[[:space:]]*build = "' Data/*/TaxiNodes.lua | sed -n 's/.*"\([0-9.]*\)".*/\1/p')"
          if [ -z "$builds" ] || printf '%s\n' "$builds" | grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid generated build catalog" >&2
            exit 1
          fi
          tag="data-multi-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "LibTaxiData multi-client data: $(printf '%s' "$builds" | paste -sd, -)"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  dispatch-release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: gh workflow run release.yml --ref main -f ref="$RELEASE_TAG"
