name: Publish merged taxi data

on:
  push:
    branches:
      - main
    paths:
      - Data/**
      - Locale/**
      - LibTaxiData.toc

permissions:
  contents: write

jobs:
  tag:
    if: vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the data build
        id: tag
        run: |
          build="$(sed -n 's/.*build = "\([^"]*\)".*/\1/p' Data/TaxiNodes.lua | head -n 1)"
          if ! printf '%s' "$build" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid generated build: $build" >&2
            exit 1
          fi
          tag="data-$build-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "LibTaxiData for Retail $build"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
