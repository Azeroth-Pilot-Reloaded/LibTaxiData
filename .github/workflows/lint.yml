name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile generator
        run: python -m py_compile tools/generate.py tools/live_build.py tools/data_fingerprint.py

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: '5.1'

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Lint Lua
        run: luacheck .

      - name: Run runtime tests
        run: lua tests/runtime.lua

      - name: Check whitespace
        run: git diff --check
