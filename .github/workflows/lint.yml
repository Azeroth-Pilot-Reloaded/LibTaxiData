name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compile generator
        run: python -m py_compile tools/generate.py tools/package.py tools/profile_catalog.py tools/profiles.py tools/live_build.py tools/data_fingerprint.py tools/release_version.py

      - name: Validate client profile catalog
        run: |
          python tools/profiles.py check
          python tests/release_version.py
          python tools/package.py --matrix
          python tools/package.py --build --output-dir .cache/release-zips
          python tests/package.py .cache/release-zips

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: '5.1'

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Lint Lua
        run: luacheck .

      - name: Run runtime tests
        run: |
          lua tests/client_selection.lua
          lua tests/compatibility.lua
          lua tests/base_versions.lua
          profiles="$(python -c 'import json; print(" ".join(p["id"] for p in json.load(open("tools/profiles.json")) if p.get("build")))')"
          for profile in $profiles; do
            lua tests/runtime.lua "$profile"
          done

      - name: Check whitespace
        run: git diff --check
