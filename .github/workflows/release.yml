name: Release addon

on:
  push:
    tags:
      - data-*
      - v*
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or Git ref to package
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Tag or Git ref to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.bundles.outputs.matrix }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve compatible data bundles
        id: bundles
        run: echo "matrix=$(python tools/package.py --matrix)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate deployment configuration
        run: |
          for name in CF_API_TOKEN WAGO_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Checkout release
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Keep only the compatible data bundle
        run: python tools/package.py --prepare "${{ matrix.data_set }}"

      - name: Package and upload to CurseForge, Wago, WoWInterface, and GitHub
        uses: BigWigsMods/packager@master
        with:
          args: >-
            -m .pkgmeta.release
            -g "${{ matrix.game_versions }}"
            -n "{package-name}-{project-version}-${{ matrix.data_set }}:{project-version}-${{ matrix.data_set }}-${{ matrix.build }}"
            -p 1636228
            -a jK8gl56y
