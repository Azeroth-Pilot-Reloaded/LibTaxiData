name: Update multi-client taxi data

on:
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types:
      - wow-build
  workflow_dispatch:
    inputs:
      profile:
        description: Client profile to update
        required: true
        default: all
        type: string
      build:
        description: Exact build for one profile; leave empty to query Blizzard
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-multi-client-taxi-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select profiles
        id: selection
        env:
          PROFILE: ${{ inputs.profile || github.event.client_payload.profile }}
          MANUAL_BUILD: ${{ inputs.build }}
          WEBHOOK_BUILD: ${{ github.event.client_payload.build }}
        run: |
          profile="$PROFILE"
          if [ -z "$profile" ] && [ -n "$WEBHOOK_BUILD" ]; then profile="retail"; fi
          if [ -z "$profile" ]; then profile="all"; fi
          requested_build="${MANUAL_BUILD:-$WEBHOOK_BUILD}"
          if [ "$profile" = "all" ] && [ -n "$requested_build" ]; then
            echo "A manual build requires a single profile." >&2
            exit 1
          fi
          if [ -n "$requested_build" ] && ! printf '%s' "$requested_build" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid build: $requested_build" >&2
            exit 1
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "slug=$profile" >> "$GITHUB_OUTPUT"

      - name: Restore DB2 cache
        uses: actions/cache@v4
        with:
          path: .cache/db2
          key: wago-db2-multi-${{ github.run_id }}
          restore-keys: |
            wago-db2-multi-

      - name: Fingerprint current taxi content
        id: before
        run: echo "fingerprint=$(python tools/data_fingerprint.py)" >> "$GITHUB_OUTPUT"

      - name: Generate data from Wago Tools
        env:
          PROFILE: ${{ steps.selection.outputs.profile }}
          MANUAL_BUILD: ${{ inputs.build }}
          WEBHOOK_BUILD: ${{ github.event.client_payload.build }}
        run: |
          args=(--cache-dir .cache/db2 --region eu)
          if [ "$PROFILE" = "all" ]; then
            args+=(--all)
          else
            args+=(--profile "$PROFILE")
            build="$MANUAL_BUILD"
            if [ -z "$build" ]; then build="$WEBHOOK_BUILD"; fi
            if [ -n "$build" ]; then args+=(--build "$build"); fi
          fi
          python tools/generate.py "${args[@]}"

      - name: Detect a semantic data change
        id: diff
        env:
          BEFORE: ${{ steps.before.outputs.fingerprint }}
        run: |
          after="$(python tools/data_fingerprint.py)"
          if [ "$BEFORE" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated profile catalog and data are unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: '5.1'

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: Validate generated addon
        run: |
          python tools/profiles.py check
          luacheck .
          python tools/package.py --build --output-dir .cache/release-zips
          python tests/package.py .cache/release-zips
          lua tests/client_selection.lua
          lua tests/compatibility.lua
          lua tests/base_versions.lua
          profiles="$(python -c 'import json; print(" ".join(p["id"] for p in json.load(open("tools/profiles.json")) if p.get("build")))')"
          for profile in $profiles; do
            lua tests/runtime.lua "$profile"
          done
          git diff --check

      - name: Create data update pull request
        if: steps.diff.outputs.changed == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/taxi-data-${{ steps.selection.outputs.slug }}
          delete-branch: true
          commit-message: Update taxi data for ${{ steps.selection.outputs.profile }}
          title: Update taxi data for ${{ steps.selection.outputs.profile }}
          body: |
            Automated update for client selection `${{ steps.selection.outputs.profile }}`.

            Builds are resolved from Blizzard's product feeds unless an exact manual build was supplied.
            Source: `TaxiNodes` and referenced condition tables from versioned Wago Tools DB2 exports.
            The generator, Lua lint, runtime tests, and whitespace validation completed successfully.
          add-paths: |
            Data/**
            Locale/**
            LibTaxiData.toc
            tools/profiles.json

      - name: Enable automatic merge
        if: vars.AUTO_MERGE_DATA_UPDATES == 'true' && steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTOMATION_TOKEN is required when AUTO_MERGE_DATA_UPDATES=true" >&2
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
